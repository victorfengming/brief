  <g fill="#142c40" stroke="#33758a" stroke-width="2"><rect x="34" y="83" width="175" height="125" rx="12"/><rect x="256" y="83" width="175" height="125" rx="12"/><rect x="478" y="83" width="175" height="125" rx="12"/><rect x="700" y="83" width="165" height="125" rx="12"/></g>
  <g fill="#e4f3f9" font-family="sans-serif" text-anchor="middle" font-size="21"><text x="121" y="150">模拟车辆</text><text x="343" y="150">MQTT Broker</text><text x="565" y="150">消息处理</text><text x="782" y="150">下游消费者</text></g>
